    capability:
      nth_supported:
        value: false
        note: "nth=-1 only. One global SEEN counter (crates/core/executor/src/vm.rs:70) is shared across the two CoreVM passes and is not reset at CoreVM construction, so a per-execution index does not mean the same thing in both passes."
      mem_read_hookable:
        value: false
        note: "CoreVM::mr (vm.rs:745-758 supervisor, :948 user) is not hooked, and the phase-2 CoreVM has no memory at all: every memory read value comes from a phase-1 oracle that IGNORES its address argument. Any RAM-mediated forgery on sp1 is structurally self-inconsistent until a read-side hook lands."
      address_hookable:
        value: false
        note: "sp1 has no address record field -- the effective address is recomputed in execute_load / execute_store from the register, so it is reachable only indirectly by perturbing the address register. A clean structural negative."
      timestamp_hookable:
        value: false
        note: "All timestamps are derived from self.clk inside rr/rw; MemoryRecord.timestamp is not independently settable."
      init_value_hookable:
        value: true
        note: "record_perturb::F_MEM_INIT_VALUE = 0, declared at crates/prover/src/utils/prove.rs:150, applied at :243-266 over global_memory_initialize_events[k].value. The only record_perturb field the shipped enumeration uses."
      final_value_hookable:
        value: true
        note: "record_perturb::F_MEM_FINAL_VALUE = 1, declared at prove.rs:152. IMPLEMENTED AND NEVER ARMED by the enumeration -- a free structure axis today."
      next_pc_hookable:
        value: false
        note: "Branch outcome and next_pc are not hookable; BranchEvent.next_pc is recomputed."
      hint_hookable:
        value: "partial"
        note: "SP1Stdin is constructed empty at every call site (crates/prover/src/lacuna_eval.rs:636,665,696,737 via minimal_executor.with_input, prove.rs:55-57), so no hint reaches the guest today. Hint pages are initialised through the very MemoryInitialize chip whose value column is unconstrained for addr != 0 (prove.rs:159-167), so wiring stdin makes the init hook double as the hint hook."
      x0_hookable:
        value: true
        note: "Expressible today: Instruction::new(op, 0, 28, 29, false, false). sp1 dedicates FOUR chips to the dark write -- AluX0, AluX0User, LoadX0, LoadX0User (crates/core/machine/src/riscv/mod.rs:141-143, :168-171, instantiated at :488-489, :498-499) -- and no sp1 candidate has ever produced a row in any of them."
