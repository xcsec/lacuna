    capability:
      nth_supported:
        value: false
        note: "nth=-1 only. Three emulation passes per candidate (driver prepass, shard planning, witness replay) share one global occurrence counter."
      mem_read_hookable:
        value: false
        note: "StepRecord.memory_op.value exists (ceno_emul/src/tracer.rs:27-47) but vm_state.rs:401-408 store_memory / load_memory carry no hook. The ~20-line stale-load hook is the single highest-value line-of-code investment in the catalog, because prev_cycle IS already a record field here."
      address_hookable:
        value: false
        note: "MemAddr is built from rs1+imm inside the circuit; no record correspondent to perturb directly."
      timestamp_hookable:
        value: true
        note: "THE ONLY TARGET WITH A FIRST-CLASS RECORD TIMESTAMP HOOK. ts_perturb::on_prev_cycle at ceno_emul/src/tracer.rs:1131 moves StepRecord.{rs1,rs2,rd,memory_op}.previous_cycle; arming key is (pc, subcycle in {0=rs1,1=rs2,2=rd,3=mem}). Fires under FullTracer only (not PreflightTracer, tracer.rs:1440), so the shard plan stays honest. This is the ENC-I4 template."
      init_value_hookable:
        value: false
        note: "NOT A RECORD FIELD AT ALL. Program.image -> init_static_addrs (e2e.rs:1248-1265) -> generate_fixed_traces (e2e.rs:1301-1320, mmu.rs:79-83) puts the static memory-init value in the FIXED trace, hence in the vk. RAM-init columns are fixed preprocessed columns (tables/ram/ram_impl.rs:69-76)."
      final_value_hookable:
        value: false
        note: "Final RAM is built from vm.peek_memory, not record-carried, and is not a public output; shard_rw_sum is bus bookkeeping."
      next_pc_hookable:
        value: false
        note: "StepRecord.pc (Change<ByteAddr>) is present in the record but carries no hook. Note that next_pc is a committed WitIn only for BRANCHING circuits (StateInOut::construct_circuit(branching=true), insn_base.rs:42-44), so a straight-line seed has no next_pc column at all."
      hint_hookable:
        value: false
        note: "ceno has a HintsTable and a hint memory region, but neither is wired into the driver's Program image and SyscallWitness.mem_ops/reg_ops are unreachable from both hooks."
      x0_hookable:
        value: true
        note: "encode_rv32 with rd=0 works today; ceno also has an explicit ecall RD_NULL dark write path (vm_state.rs:213) that the write-back hook already covers."
