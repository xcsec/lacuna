# LACUNA -- per-target capability record.
#
# GENERATED AS SPEC DATA, NOT AS A REPORT. Every field here is either copied from
# evaluation/spec/_design/target_surveys.json and the structure catalog, or derived
# mechanically from the shipped corpus (data/targets.csv and
# the published candidates table). Nothing here is measured by the phase that wrote it.
#
# Companion files: STRUCTURE_MANIFEST.yaml (what to build), LACUNA_STRUCTURES.md (why),
# README.md (how a port is checked). Validate with evaluation/scripts/check_manifest.py.
#
# YAML SUBSET. Block mappings, block sequences, and scalars that are one of
# true / false / null / a number / a double-quoted single-line string. No anchors,
# no flow collections except [] and {} for empties, no multi-line scalars.
# check_manifest.py parses exactly this subset with the standard library and raises
# on anything outside it, so there is no second serialisation to keep in sync.
capabilities_version: 1
spec_revision: "2026-08-28"
what_this_is: "The machine-readable per-target capability record required by shared_infrastructure item 7 of evaluation/spec/_design/the structure catalog. A blocked (structure, target) cell in STRUCTURE_MANIFEST.yaml is a JOIN against this file, not prose in a README."
flag_names:
  - "nth_supported"
  - "mem_read_hookable"
  - "address_hookable"
  - "timestamp_hookable"
  - "init_value_hookable"
  - "final_value_hookable"
  - "next_pc_hookable"
  - "hint_hookable"
  - "x0_hookable"
flag_values:
  - true
  - false
  - "partial"
  - "not_determined"
flag_value_meanings:
  value_true: "usable today by a port with no vendor-tree change beyond arming it"
  value_false: "not reachable today; the note says whether that is a missing hook (fixable) or a structural absence (a publishable negative)"
  value_partial: "reachable in a restricted form only; the note states the restriction"
  value_not_determined: "nobody has established it either way. NOT a synonym for false -- do not report it as a negative result"
site_key: "(pc, nth, mu) on all seven targets. `nth` does NOT mean the same thing everywhere: see nth_supported. Where nth_supported is false the only legal arming is nth=-1 (mutate every execution of the pc) and the CSV must say so."
