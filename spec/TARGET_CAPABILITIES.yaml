    capability:
      nth_supported:
        value: true
        note: "Full per-execution granularity. wb_perturb::begin(pc) is called at the head of emulate_instruction (emulator/instruction.rs:48) and the occurrence counter is per static pc. pico and risc0 are the only two targets where nth>=0 works today."
      mem_read_hookable:
        value: "partial"
        note: "Doubleword loads only, and only as a STALE-VALUE operator: stale_load::on_load(pc, align_u64(addr), v) at emulator/instruction.rs:334 in the Opcode::LD arm returns the second-most-recent value written to that address. Sub-word load delivery (LB/LBU/LH/LHU/LW/LWU) is not hooked, and there is no free-value substitution on the read side."
      address_hookable:
        value: false
        note: "A bug-specific seam exists but is not wired into lacuna_eval: n1_forge at emulator/mod.rs:243-296. The addr_aligned / addr_word fields come from one source, so an address forgery is expressible in ENCODING mode only, by perturbing the write-back that materialises the pointer."
      timestamp_hookable:
        value: "partial"
        note: "Not a record field. Timestamps are reachable only post-trace-generation through forge_hook::apply (instances/machine/riscv.rs:232, module at :700-750), which BIND-O1 uses to rewrite clk / prev_clk / prev_chunk / compare_clk / diff_16bit_limb / diff_8bit_limb. KoalaBear-only (assert at riscv.rs:737-741)."
      init_value_hookable:
        value: false
        note: "No hook on the MemoryInitialize event value or on the program image. This is what makes st_initial_state hard on pico: the shipped st_initial_state seed is inert and its binding accepts are incidental stack-slot fires."
      final_value_hookable:
        value: false
        note: "No hook on the memory-finalize event value; and nothing about final state is public on pico, so it would not be observable even if hooked."
      next_pc_hookable:
        value: true
        note: "IMPLEMENTED BUT NEVER USED BY LACUNA. wb_perturb::next_pc (emulator/mod.rs:134-142) is called at emulator/instruction.rs:954 and armed by wb_perturb::with_pc (mod.rs:113-132); only lt/tests.rs:3618 exercises it."
      hint_hookable:
        value: "partial"
        note: "pico has no separate hint channel in these seeds: stdin IS the operand channel (EmulatorStdin, read_as::<u64>). Every operand-setup write-back is therefore already sitting on the hint hazard; st_hint_advice names it rather than adding a channel."
      x0_hookable:
        value: false
        note: "The choke point explicitly skips X0 (emulator/mod.rs:1982-1986) and rw zeroes writes to it (:1979). One-line relaxation, not a VM property."
